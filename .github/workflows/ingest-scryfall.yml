name: Ingest Scryfall Daily

on:
  schedule:
    - cron: "30 9 * * *"   # 09:30 UTC daily
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Stage (bulk → staging)
        env:
          NODE_ENV: production
          SCRYFALL_BULK_DATASET: default_cards
          SCRYFALL_FILTER_PAPER_ONLY: "true"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          SUPABASE_CA_PEM_BASE64: ${{ secrets.SUPABASE_CA_PEM_BASE64 }}
        run: npm run ingest:stage -- --paper-only --dataset=default_cards --hard-timeout-ms=120000

      - name: Update (staging → MtgCard)
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          SUPABASE_CA_PEM_BASE64: ${{ secrets.SUPABASE_CA_PEM_BASE64 }}
        run: npm run ingest:update

      - name: History (MtgCard → price history)
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          SUPABASE_CA_PEM_BASE64: ${{ secrets.SUPABASE_CA_PEM_BASE64 }}
        run: npm run ingest:history

      - name: Retention (cleanup >30d old)
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          SUPABASE_CA_PEM_BASE64: ${{ secrets.SUPABASE_CA_PEM_BASE64 }}
        run: npm run ingest:retention

